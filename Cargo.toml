[package]
name = "clickhouse-c-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust bindings for clickhouse-c, the header-only C client for the ClickHouse Native wire format"
repository = "https://github.com/ClickHouse/clickhouse-c-rs"
documentation = "https://docs.rs/clickhouse-c-rs"
readme = "README.md"
license = "Apache-2.0"
keywords = ["clickhouse", "database", "native", "ffi", "bindings"]
categories = ["database", "api-bindings", "external-ffi-bindings"]
# Bundled clickhouse-c exports global C symbols. `links` makes Cargo reject a
# dependency graph holding two copies, which would be a duplicate-symbol link
# error or, worse, silent interposition of mismatched ABIs.
links = "clickhouse-c"
include = [
    "/build.rs",
    "/Cargo.toml",
    "/LICENSE",
    "/CHANGELOG.md",
    "/README.md",
    "/UPSTREAM",
    "/clickhouse-c/LICENSE",
    "/clickhouse-c/*.h",
    "/examples/*.rs",
    "/src/*.c",
    "/src/*.rs",
    "/tests/**/*.rs",
]

[lib]
name = "clickhouse_c"
path = "src/lib.rs"

# Servers negotiate LZ4 in practice, so the common build wants it and it stays
# on by default; it links the system liblz4. `default-features = false` drops
# to a build needing only a C compiler and libc, matching what
# `#include "clickhouse.h"` alone costs in C.
[features]
default = ["lz4"]
lz4 = []
tls = ["dep:rustls", "dep:webpki-roots", "dep:tokio-rustls"]
tokio = ["dep:tokio"]
zstd = []

[dependencies]
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"], optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[[example]]
name = "spawn_clickhouse_local"
path = "examples/spawn_clickhouse_local.rs"

[[test]]
name = "async_client"
path = "tests/async_client.rs"
required-features = ["tokio"]

[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["tls", "tokio"]

[[test]]
name = "tls_live"
path = "tests/tls_live.rs"
required-features = ["tls", "tokio"]

[[test]]
name = "docs_examples"
path = "tests/docs_examples.rs"
required-features = ["lz4", "tls", "tokio"]
